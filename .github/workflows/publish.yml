name: publish

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1" # weekly, picks up new Claude Code releases
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: date
        run: echo "tag=$(date -u +%Y.%m.%d)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: image
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/claude-box:base
            ghcr.io/${{ github.repository_owner }}/claude-box:base-${{ steps.date.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
